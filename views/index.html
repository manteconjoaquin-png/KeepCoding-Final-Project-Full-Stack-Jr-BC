<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>CineLocal | Películas para conversar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#202b2a;--muted:#67716b;--paper:#f5f4ef;--surface:#fffefa;--green:#2c6654;--coral:#df7458;--line:#dedfd6}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh}
    .topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;background:rgba(255,254,250,.8)}
    .brand{font-family:'Playfair Display',serif;font-size:24px;color:var(--ink);text-decoration:none}.brand-mark{color:var(--coral);margin-right:8px}
    .masthead{padding:64px 0 38px;background:radial-gradient(ellipse at 80% 0%,rgba(220,229,211,.8),transparent 42%),linear-gradient(135deg,#f5f4ef,#eeefe7)}
    .eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:11px;font-weight:700;color:var(--green)} h1{font:700 clamp(38px,5vw,58px)/1.07 'Playfair Display',serif;max-width:660px;margin:12px 0 14px}
    .intro{color:var(--muted);max-width:550px;font-size:16px}.search-form{max-width:690px;margin-top:29px;background:var(--surface);padding:7px;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 24px rgba(35,48,41,.06)}
    .search-form input{border:0;background:transparent;box-shadow:none!important;padding:12px 14px;min-width:0}.search-form button{width:100%;min-height:46px;background:var(--green);border:0;color:white;border-radius:5px;padding:0 22px;font-weight:700;white-space:nowrap}.search-form button:hover{background:#214d3f}
    main{padding:32px 0 80px}.results-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.results-head h2{font:600 26px 'Playfair Display',serif;margin:0}.results-head p{margin:5px 0 0;color:var(--muted);font-size:14px}
    .movie-card{height:100%;border:1px solid var(--line);border-radius:7px;background:var(--surface);overflow:hidden;transition:transform .2s,box-shadow .2s;animation:arrive .45s both}.movie-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(32,43,42,.09)}
    .poster-wrap{aspect-ratio:2/2.72;background:#e6e7df;overflow:hidden}.poster-wrap img{width:100%;height:100%;object-fit:cover}.poster-empty{height:100%;display:grid;place-items:center;color:#929b90;font-size:13px}
    .card-body{padding:16px}.movie-title{font:600 19px/1.25 'Playfair Display',serif;margin:0 0 7px}.movie-meta{color:var(--muted);font-size:13px}.rating-line{color:#a46516;font-size:13px;margin-top:11px;min-height:20px}.detail-btn{background:transparent;border:1px solid #9ba79e;color:var(--green);font-weight:700;font-size:13px;padding:8px 11px;border-radius:5px}.detail-btn:hover{background:var(--green);color:white}
    .empty-state{padding:55px 20px;text-align:center;border:1px dashed #bdc5ba;border-radius:7px;color:var(--muted);background:rgba(255,254,250,.45)}.empty-state strong{display:block;font:600 21px 'Playfair Display',serif;color:var(--ink);margin-bottom:6px}
    .modal-content{border:0;border-radius:9px;overflow:hidden;background:var(--surface)}.modal-header{border-bottom:1px solid var(--line);padding:20px 24px}.modal-title{font:600 24px 'Playfair Display',serif}.modal-body{padding:24px}.detail-layout{display:grid;grid-template-columns:180px 1fr;gap:24px}.detail-poster{width:100%;aspect-ratio:2/2.85;object-fit:cover;background:#e6e7df;border-radius:5px}.detail-copy{color:var(--muted);line-height:1.65}.detail-rating{color:#b6771f;font-size:22px;letter-spacing:0}.detail-score{font-size:13px;color:var(--muted);margin-left:8px}.section-label{font-size:12px;text-transform:uppercase;font-weight:700;color:var(--green);margin:24px 0 9px}.comment-list{max-height:185px;overflow:auto;border-top:1px solid var(--line)}.comment-item{padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}.comment-date{display:block;color:#8a928b;font-size:11px;margin-top:4px}.comment-empty{padding:14px 0;color:var(--muted);font-size:14px}.form-row{display:flex;gap:8px}.form-row .form-control,.form-row .form-select{border-color:var(--line);border-radius:5px}.action-btn{background:var(--green);border:0;color:white;border-radius:5px;padding:9px 15px;font-weight:700;white-space:nowrap}.action-btn:hover{background:#214d3f;color:white}.status-message{font-size:13px;min-height:20px;margin-top:8px;color:var(--coral)}
    @keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:575px){.masthead{padding:43px 0 28px}.topbar{height:64px}.detail-layout{grid-template-columns:96px 1fr;gap:15px}.detail-copy{font-size:14px}.modal-body{padding:17px}.search-form button{padding:0 13px}.results-head h2{font-size:23px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="container"><a class="brand" href="/"><span class="brand-mark">●</span>CineLocal</a></div></header>
  <section class="masthead"><div class="container">
    <div class="eyebrow">Tu archivo de películas</div>
    <h1>Frio. Lluvia. Manta. Película. Plan perfecto.</h1>
    <p class="intro">Buscá tu película y no te olvides de ayudarnos con comentarios.</p>
    <form class="search-form row g-2 align-items-center" id="search-form">
      <div class="col-12 col-sm"><input class="form-control" id="search-input" type="search" placeholder="Busca por título, por ejemplo: Arrival" aria-label="Buscar películas" required maxlength="100"></div>
      <div class="col-5 col-sm-3"><input class="form-control" id="searchYear" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="Año" aria-label="Año de estreno"></div>
      <div class="col-7 col-sm-auto"><button type="submit" id="search-button">Buscar películas</button></div>
    </form>
    <div id="search-status" class="status-message" role="status"></div>
  </div></section>
  <main class="container">
    <div class="results-head"><div><h2 id="results-title">Explora el catálogo</h2><p id="results-subtitle">Busca una película para empezar.</p></div></div>
    <div id="results" class="row g-3"></div>
  </main>

  <div class="modal fade" id="movie-modal" tabindex="-1" aria-labelledby="modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title" id="modal-title">Película</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
      <div class="modal-body" id="modal-content"></div>
    </div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const results = document.querySelector('#results');
    const searchStatus = document.querySelector('#search-status');
    const searchButton = document.querySelector('#search-button');
    const modalElement = document.querySelector('#movie-modal');
    const movieModal = new bootstrap.Modal(modalElement);
    let activeMovieId = null;

    function escapeHtml(value = '') {
      return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    }
    function errorMessage(detail, fallback) {
      if (typeof detail === 'string' && detail.trim()) return detail;
      if (detail && typeof detail === 'object') return detail.msg || JSON.stringify(detail);
      return fallback;
    }
    function stars(value) {
      const rounded = Math.round(Number(value) || 0);
      return '★'.repeat(rounded) + '☆'.repeat(5 - rounded);
    }
    function renderCard(movie, index) {
      const poster = movie.poster
        ? `<img src="${escapeHtml(movie.poster)}" alt="Póster de ${escapeHtml(movie.title)}" loading="lazy" onerror="this.remove()">`
        : '<div class="poster-empty">Póster no disponible</div>';
      return `<div class="col-6 col-md-4 col-lg-3" style="animation-delay:${index * 45}ms"><article class="movie-card">
        <div class="poster-wrap">${poster}</div><div class="card-body"><h3 class="movie-title">${escapeHtml(movie.title)}</h3>
        <div class="movie-meta">${escapeHtml(movie.year)}</div><div class="rating-line">${movie.average_rating ? `${stars(movie.average_rating)} <span class="text-secondary">${Number(movie.average_rating).toFixed(1)} (${movie.ratings_count})</span>` : 'Aún sin valoraciones'}</div>
        <button class="detail-btn mt-2" data-movie-id="${movie.id}">Ver detalles</button></div></article></div>`;
    }
    function renderComments(comments) {
      if (!comments.length) return '<div class="comment-empty">Todavía no hay comentarios. Abre la conversación.</div>';
      return comments.map(comment => `<div class="comment-item">${escapeHtml(comment.text)}<time class="comment-date">${new Date(comment.created_at).toLocaleString('es-ES')}</time></div>`).join('');
    }
    function renderModal(movie) {
      document.querySelector('#modal-title').textContent = movie.title;
      const poster = movie.poster ? `<img class="detail-poster" src="${escapeHtml(movie.poster)}" alt="Póster de ${escapeHtml(movie.title)}" onerror="this.style.visibility='hidden'">` : '<div class="detail-poster"></div>';
      document.querySelector('#modal-content').innerHTML = `<div class="detail-layout">${poster}<div><div class="movie-meta mb-2">${escapeHtml(movie.year)}</div><p class="detail-copy">${escapeHtml(movie.plot || 'Sinopsis no disponible.')}</p><div><span class="detail-rating" aria-label="${movie.average_rating} de 5 estrellas">${stars(movie.average_rating)}</span><span class="detail-score">${movie.average_rating ? Number(movie.average_rating).toFixed(1) : 'Sin votos'} · ${movie.ratings_count} valoraciones</span></div></div></div>
        <div class="section-label">Valoración</div><form id="rating-form" class="form-row"><select class="form-select" name="score" aria-label="Tu puntuación" required><option value="">Elige de 1 a 5 estrellas</option><option value="5">5 estrellas</option><option value="4">4 estrellas</option><option value="3">3 estrellas</option><option value="2">2 estrellas</option><option value="1">1 estrella</option></select><button class="action-btn" type="submit">Valorar</button></form>
        <div class="section-label">Comentarios</div><div class="comment-list" id="comment-list">${renderComments(movie.comments || [])}</div>
        <form id="comment-form" class="mt-3"><div class="form-row"><input class="form-control" name="text" maxlength="2000" placeholder="Escribe tu comentario..." aria-label="Comentario" required><button class="action-btn" type="submit">Publicar</button></div></form><div class="status-message" id="modal-status" role="status"></div>`;
      document.querySelector('#rating-form').addEventListener('submit', submitRating);
      document.querySelector('#comment-form').addEventListener('submit', submitComment);
    }
    async function loadDetails(movieId) {
      activeMovieId = movieId;
      document.querySelector('#modal-title').textContent = 'Cargando...';
      document.querySelector('#modal-content').innerHTML = '<p class="text-secondary mb-0">Cargando información de la película...</p>';
      movieModal.show();
      try {
        const response = await fetch(`/api/movies/${movieId}`);
        const movie = await response.json();
        if (!response.ok) throw new Error(movie.detail || 'No se pudo cargar la película.');
        if (activeMovieId === movieId) renderModal(movie);
      } catch (error) {
        document.querySelector('#modal-content').innerHTML = `<p class="text-danger">${escapeHtml(error.message)}</p>`;
      }
    }
    async function refreshDetails() {
      const response = await fetch(`/api/movies/${activeMovieId}`);
      const movie = await response.json();
      if (!response.ok) throw new Error(movie.detail || 'No se pudo actualizar la película.');
      renderModal(movie);
      return movie;
    }
    async function submitRating(event) {
      event.preventDefault();
      const status = document.querySelector('#modal-status');
      const formData = new FormData(event.currentTarget);
      try {
        const response = await fetch(`/api/movies/${activeMovieId}/rate`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({score:Number(formData.get('score'))})});
        const data = await response.json();
        if (!response.ok) throw new Error(errorMessage(data.detail, 'No se pudo guardar la valoración.'));
        await refreshDetails();
        document.querySelector('#modal-status').textContent = 'Valoración guardada.';
        document.querySelector('#modal-status').className = 'status-message';
        await refreshSearchCard(activeMovieId);
      } catch (error) {
        status.textContent = error.message || 'No se pudo guardar la valoración.';
        status.className = 'alert alert-danger mt-2 mb-0';
      }
    }
    async function submitComment(event) {
      event.preventDefault();
      const status = document.querySelector('#modal-status');
      const formData = new FormData(event.currentTarget);
      const text = String(formData.get('text') || '').trim();
      if (!text) {
        status.textContent = 'Escribe un comentario antes de publicarlo.';
        status.className = 'alert alert-warning mt-2 mb-0';
        return;
      }
      try {
        const response = await fetch(`/api/movies/${activeMovieId}/comment`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
        const data = await response.json();
        if (!response.ok) throw new Error(errorMessage(data.detail, 'No se pudo publicar el comentario.'));
        await refreshDetails();
        document.querySelector('#modal-status').textContent = 'Comentario publicado.';
        document.querySelector('#modal-status').className = 'status-message';
      } catch (error) {
        status.textContent = error.message || 'No se pudo publicar el comentario.';
        status.className = 'alert alert-danger mt-2 mb-0';
      }
    }
    async function refreshSearchCard(movieId) {
      const response = await fetch(`/api/movies/${movieId}`);
      if (!response.ok) return;
      const movie = await response.json();
      const button = results.querySelector(`[data-movie-id="${movieId}"]`);
      if (!button) return;
      const line = button.closest('.card-body').querySelector('.rating-line');
      line.innerHTML = `${stars(movie.average_rating)} <span class="text-secondary">${Number(movie.average_rating).toFixed(1)} (${movie.ratings_count})</span>`;
    }
    document.querySelector('#search-form').addEventListener('submit', async event => {
      event.preventDefault();
      const title = document.querySelector('#search-input').value.trim();
      const year = document.querySelector('#searchYear').value.trim();
      if (!title) return;
      searchButton.disabled = true;
      searchButton.textContent = 'Buscando...';
      searchStatus.textContent = '';
      results.innerHTML = '';
      try {
        const params = new URLSearchParams({title});
        if (year) params.set('year', year);
        const response = await fetch(`/api/movies?${params}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'No se pudo completar la búsqueda.');
        document.querySelector('#results-title').textContent = `Resultados para “${title}”${year ? ` (${year})` : ''}`;
        document.querySelector('#results-subtitle').textContent = `${data.length} película${data.length === 1 ? '' : 's'} encontrada${data.length === 1 ? '' : 's'}.`;
        results.innerHTML = data.length ? data.map(renderCard).join('') : '<div class="col-12"><div class="empty-state"><strong>No encontramos esa película</strong>Prueba con otro título.</div></div>';
      } catch (error) {
        searchStatus.textContent = error.message;
        document.querySelector('#results-title').textContent = 'No se pudo completar la búsqueda';
      } finally {
        searchButton.disabled = false;
        searchButton.textContent = 'Buscar películas';
      }
    });
    results.addEventListener('click', event => {
      const button = event.target.closest('[data-movie-id]');
      if (button) loadDetails(button.dataset.movieId);
    });
  </script>
</body>
</html>
